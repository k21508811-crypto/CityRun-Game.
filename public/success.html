<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплата City Run</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell success"><div class="brand"><span class="mark">C</span>CITY RUN</div><div class="eyebrow">ЗАКАЗ</div><h1>Проверяем<br><em>оплату…</em></h1><p id="result">Подтверждаем платёж и готовим лицензионный ключ.</p><code id="key" hidden></code><a href="/">Вернуться на главную</a></main><script>
const id=new URLSearchParams(location.search).get('session_id');const result=document.querySelector('#result'),key=document.querySelector('#key');async function check(){if(!id){result.textContent='Не найден номер заказа.';return;}try{const r=await fetch('/api/order/'+encodeURIComponent(id));const d=await r.json();if(d.key){result.textContent='Оплата подтверждена. Сохрани ключ — он понадобится для активации.';key.hidden=false;key.textContent=d.key;}else if(d.pending){result.textContent=d.message;setTimeout(check,3000);}else{result.textContent=d.error||'Не удалось получить заказ.';}}catch{result.textContent='Ошибка соединения. Обнови страницу позже.';}}check();</script></body></html>
